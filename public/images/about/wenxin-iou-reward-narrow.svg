<text x="44" y="738" class="head" style="fill:#147d70">03  可验证奖励 · 训练时</text>
<text x="44" y="781" class="body">预测框与参考框 → IoU 定位奖励</text>
<text x="44" y="819" class="body">生成答案与标准答案 → 答案奖励</text>
<text x="44" y="866" class="head" style="fill:#147d70">R = ranswer + λ · rloc</text>
<text x="44" y="909" class="body">两项信号共同用于 RLVR 更新</text>
<text x="44" y="945" class="small" style="fill:#64748b">参考标注不作为推理输入</text>
<text x="24" y="1007" class="small" style="fill:#64748b">图表示例仅说明机制。推理时输入图像与问题，</text>
<text x="24" y="1031" class="small" style="fill:#64748b">由模型自主定位关键区域并回答。</text>
