<text x="42" y="416" class="head" style="fill:#2563eb">02  定位 → 作答</text>
<text x="42" y="453" class="head">策略模型 πθ</text>
<rect x="42" y="474" width="356" height="70" rx="8" fill="#eff6ff" stroke="#93b4fb"/>
<text x="54" y="500" class="body" style="fill:#2563eb">预测区域 Bpred</text>
