<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 540" role="img" aria-labelledby="title description">
  <title id="title">平安科技工具调用开发流水线</title>
  <desc id="description">真实业务场景经过工具定义、样本构造与质量筛选，进入玲珑心 7B 的全量 SFT 与 GRPO 训练，再通过 Pingan-700、T-Eval、BFCL 评测，失败样本回流下一轮数据构造。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#17233b}
      .stage{font-size:22px;font-weight:700}
      .num{font-size:16px;font-weight:700}
      .label{font-size:18px;font-weight:650}
      .small{font-size:15px;fill:#52627a}
      .tiny{font-size:14px;fill:#52627a}
      .mono{font-family:ui-monospace,Consolas,monospace;font-size:15px}
    </style>
  </defs>

  <rect x="1" y="1" width="1238" height="538" rx="15" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <path d="M413 82V453M838 82V453" fill="none" stroke="#dbe3ef" stroke-width="1.5" stroke-dasharray="5 7"/>

  <circle cx="55" cy="48" r="19" fill="#eaf2ff"/><text class="num" x="55" y="54" text-anchor="middle" fill="#2563eb">01</text>
  <text class="stage" x="88" y="56">数据构造</text>
  <path d="M42 78H388" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>

  <circle cx="465" cy="48" r="19" fill="#f1edff"/><text class="num" x="465" y="54" text-anchor="middle" fill="#7c3aed">02</text>
  <text class="stage" x="498" y="56">训练开发</text>
  <path d="M451 78H813" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>

  <circle cx="893" cy="48" r="19" fill="#e8f7f0"/><text class="num" x="893" y="54" text-anchor="middle" fill="#059669">03</text>
  <text class="stage" x="926" y="56">评测与回流</text>
  <path d="M878 78H1198" stroke="#059669" stroke-width="3" stroke-linecap="round"/>

  <text class="small" x="54" y="112">真实业务场景</text>
  <rect x="54" y="126" width="143" height="49" rx="9" fill="#f7faff" stroke="#b9d1fb" stroke-width="1.5"/>
  <text class="label" x="125" y="157" text-anchor="middle">金融任务</text>
  <rect x="221" y="126" width="143" height="49" rx="9" fill="#f7faff" stroke="#b9d1fb" stroke-width="1.5"/>
  <text class="label" x="292" y="157" text-anchor="middle">通用任务</text>
  <path d="M125 175V191H209M292 175V191H209M209 191V208" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="54" y="218" width="310" height="116" rx="11" fill="#f7faff" stroke="#9bbff7" stroke-width="1.7"/>
  <text class="label" x="74" y="248">工具定义与样本构造</text>
  <path d="M74 261H344" stroke="#d5e5fc" stroke-width="1.5"/>
  <rect x="74" y="274" width="117" height="38" rx="6" fill="#fff" stroke="#c8d8ed"/>
  <text class="mono" x="132" y="298" text-anchor="middle">tool schema</text>
  <path d="M195 293H217" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="225" y="274" width="119" height="38" rx="6" fill="#fff" stroke="#c8d8ed"/>
  <text class="small" x="284" y="299" text-anchor="middle">调用样本</text>

  <path d="M209 334V350" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="86" y="358" width="246" height="70" rx="10" fill="#fff" stroke="#b9cce4" stroke-width="1.5"/>
  <circle cx="112" cy="393" r="13" fill="#eaf2ff"/>
  <path d="m106 393 4 4 8-9" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="139" y="389">质量筛选</text>
  <text class="tiny" x="139" y="411">格式、参数与调用链检查</text>

  <rect x="465" y="126" width="316" height="52" rx="9" fill="#f8f6ff" stroke="#d2c8f7" stroke-width="1.5"/>
  <text class="small" x="485" y="157">训练基座</text>
  <text class="label" x="604" y="157">玲珑心 7B</text>
  <path d="M623 178V224" fill="none" stroke="#7c3aed" stroke-width="1.9" marker-end="url(#arrow-violet)"/>

  <path d="M332 393H399V268H466" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text class="tiny" x="368" y="378" text-anchor="middle">高质量语料</text>

  <rect x="473" y="232" width="133" height="78" rx="11" fill="#f8f6ff" stroke="#b8a9ef" stroke-width="1.8"/>
  <text class="label" x="539" y="267" text-anchor="middle">全量 SFT</text>
  <text class="tiny" x="539" y="291" text-anchor="middle">能力注入</text>
  <path d="M606 270H643" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#arrow-violet)"/>
  <rect x="651" y="232" width="145" height="78" rx="11" fill="#f8f6ff" stroke="#b8a9ef" stroke-width="1.8"/>
  <text class="label" x="723" y="267" text-anchor="middle">GRPO</text>
  <text class="tiny" x="723" y="291" text-anchor="middle">奖励优化</text>
  <text class="tiny" x="478" y="340">SFT 学习：工具选择 / 参数填充 / 多步调用</text>

  <path d="M723 360V314" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-violet)"/>
  <rect x="468" y="366" width="328" height="64" rx="9" fill="#fff" stroke="#d2c8f7" stroke-width="1.5"/>
  <text class="tiny" x="484" y="390">奖励维度</text>
  <text class="tiny" x="484" y="413">工具名称　参数正确性　调用顺序　使用率</text>

  <text class="small" x="880" y="112">内部与公开基准</text>
  <rect x="880" y="126" width="320" height="61" rx="9" fill="#f5fcf8" stroke="#b7dfcb" stroke-width="1.5"/>
  <path d="M987 138V175M1094 138V175" stroke="#cee8d9" stroke-width="1.2"/>
  <text class="small" x="933" y="163" text-anchor="middle">Pingan-700</text>
  <text class="small" x="1040" y="163" text-anchor="middle">T-Eval</text>
  <text class="small" x="1147" y="163" text-anchor="middle">BFCL</text>
  <path d="M1040 187V224" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <path d="M796 270H871" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <text class="tiny" x="833" y="248" text-anchor="middle">训练后模型</text>
  <rect x="880" y="232" width="320" height="78" rx="11" fill="#f5fcf8" stroke="#9fd5b9" stroke-width="1.8"/>
  <text class="label" x="1040" y="267" text-anchor="middle">Agent 评测</text>
  <text class="tiny" x="1040" y="292" text-anchor="middle">工具选择 · 参数准确性 · 多步调用</text>
  <path d="M1040 310V350" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="880" y="358" width="320" height="70" rx="10" fill="#fff" stroke="#b7dfcb" stroke-width="1.5"/>
  <text class="label" x="900" y="387">错误分析</text>
  <text class="tiny" x="900" y="410">失败样本分层 → 下一轮数据修订</text>

  <path d="M1040 428V489H26V276H53" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow-gray)"/>
  <rect x="503" y="473" width="222" height="33" rx="6" fill="#fff" stroke="#dbe3ef"/>
  <text class="small" x="614" y="495" text-anchor="middle">失败样本定向回流</text>
</svg>
