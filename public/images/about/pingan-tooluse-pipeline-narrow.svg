<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 885" role="img" aria-labelledby="title description">
  <title id="title">平安科技工具调用开发流水线，窄屏版</title>
  <desc id="description">数据构造、全量 SFT 和 GRPO 训练、评测与失败样本回流的三个阶段。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#17233b}
      .stage{font-size:24px;font-weight:700}.num{font-size:16px;font-weight:700}
      .label{font-size:19px;font-weight:650}.small{font-size:16px;fill:#52627a}
      .tiny{font-size:15px;fill:#52627a}.mono{font-family:ui-monospace,Consolas,monospace;font-size:15px}
    </style>
  </defs>
  <rect x="1" y="1" width="618" height="883" rx="15" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>

  <circle cx="49" cy="43" r="19" fill="#eaf2ff"/><text class="num" x="49" y="49" text-anchor="middle">01</text>
  <text class="stage" x="81" y="51">数据构造</text>
  <path d="M34 76H586" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text class="small" x="53" y="108">真实业务场景</text>
  <rect x="53" y="122" width="162" height="46" rx="8" fill="#f7faff" stroke="#b9d1fb" stroke-width="1.5"/>
  <text class="label" x="134" y="151" text-anchor="middle">金融任务</text>
  <rect x="233" y="122" width="162" height="46" rx="8" fill="#f7faff" stroke="#b9d1fb" stroke-width="1.5"/>
  <text class="label" x="314" y="151" text-anchor="middle">通用任务</text>
  <path d="M134 168V179H224M314 168V179H224M224 179V185" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="53" y="185" width="344" height="70" rx="10" fill="#f7faff" stroke="#9bbff7" stroke-width="1.7"/>
  <text class="label" x="71" y="213">工具定义与样本构造</text>
  <text class="small" x="71" y="239">tool schema → 结构化调用样本</text>
  <path d="M397 220H428" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="436" y="185" width="130" height="70" rx="10" fill="#fff" stroke="#b9cce4" stroke-width="1.5"/>
  <text class="label" x="501" y="214" text-anchor="middle">质量筛选</text>
  <text class="tiny" x="501" y="238" text-anchor="middle">格式 / 参数</text>
  <path d="M501 255V294" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="49" cy="318" r="19" fill="#f1edff"/><text class="num" x="49" y="324" text-anchor="middle">02</text>
  <text class="stage" x="81" y="326">训练开发</text>
  <path d="M34 351H586" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <rect x="53" y="374" width="513" height="45" rx="8" fill="#f8f6ff" stroke="#d2c8f7" stroke-width="1.5"/>
  <text class="small" x="72" y="403">训练基座</text>
  <text class="label" x="191" y="403">玲珑心 7B</text>
  <path d="M300 419V439" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="53" y="447" width="235" height="77" rx="10" fill="#f8f6ff" stroke="#b8a9ef" stroke-width="1.7"/>
  <text class="label" x="170" y="480" text-anchor="middle">全量 SFT</text>
  <text class="tiny" x="170" y="506" text-anchor="middle">选择 / 参数 / 多步调用</text>
  <path d="M288 486H322" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="331" y="447" width="235" height="77" rx="10" fill="#f8f6ff" stroke="#b8a9ef" stroke-width="1.7"/>
  <text class="label" x="448" y="480" text-anchor="middle">GRPO 优化</text>
  <text class="tiny" x="448" y="506" text-anchor="middle">多维奖励约束</text>
  <rect x="53" y="538" width="315" height="56" rx="8" fill="#fff" stroke="#d2c8f7" stroke-width="1.5"/>
  <text class="tiny" x="71" y="561">奖励：工具名称 · 参数正确性</text>
  <text class="tiny" x="71" y="582">调用顺序 · 工具使用率</text>
  <path d="M368 556H448V524" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M520 524V695H448V706" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="49" cy="649" r="19" fill="#e8f7f0"/><text class="num" x="49" y="655" text-anchor="middle">03</text>
  <text class="stage" x="81" y="657">评测与回流</text>
  <path d="M34 681H586" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <rect x="53" y="710" width="235" height="55" rx="9" fill="#f5fcf8" stroke="#b7dfcb" stroke-width="1.5"/>
  <text class="small" x="170" y="733" text-anchor="middle">内部与公开基准</text>
  <text class="tiny" x="170" y="753" text-anchor="middle">Pingan-700 / T-Eval / BFCL</text>
  <path d="M288 738H322" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="331" y="710" width="235" height="55" rx="9" fill="#f5fcf8" stroke="#9fd5b9" stroke-width="1.7"/>
  <text class="label" x="448" y="740" text-anchor="middle">Agent 评测</text>
  <path d="M448 765V785" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="331" y="793" width="235" height="55" rx="9" fill="#fff" stroke="#b7dfcb" stroke-width="1.5"/>
  <text class="label" x="448" y="816" text-anchor="middle">错误分析</text>
  <text class="tiny" x="448" y="837" text-anchor="middle">失败样本定向回流</text>
  <path d="M448 848V859H22V220H53" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
</svg>
