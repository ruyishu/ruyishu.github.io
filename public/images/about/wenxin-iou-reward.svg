<text x="742" y="262" class="body">答案：42 ↔ 标准答案</text>
<text x="742" y="284" class="small" style="fill:#147d70">ranswer = 可验证答案得分</text>
<text x="730" y="331" class="head" style="fill:#147d70">R = ranswer + λ · rloc</text>
