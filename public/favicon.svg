<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; transition: fill 0.2s ease; }
      .text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 58px; font-weight: 800; letter-spacing: -2px; }
      .accent { fill: #38bdf8; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #1e293b; }
        .text { fill: #f8fafc; }
        .accent { fill: #60a5fa; }
      }
    </style>
  </defs>
  <rect class="bg" width="128" height="128" rx="28" />
  <text class="text" x="64" y="82" text-anchor="middle">Z<tspan class="accent">K</tspan></text>
</svg>
